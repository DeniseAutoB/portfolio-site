kind = "web"
previewPath = "/"
title = "GTM Engineer Portfolio"
description = "A personal portfolio for a GTM Engineer, with clear positioning around revenue systems, automation, and a gallery of editable work samples."
version = "1.0.0"
id = "artifacts/gtm-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20806

[services.development]
run = "pnpm --filter @workspace/gtm-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gtm-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/gtm-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20806"
BASE_PATH = "/"
